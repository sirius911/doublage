# Déploiement avec podman-compose (version 1.0.6), sur le stockage Podman dédié à doublage :
#   cp .env.exemple .env   # puis adapter
#   deploiement/podman-doublage podman-compose up -d --build
# (voir README.md, « Déploiement sur la VM »)
#
# Tout est préfixé « doublage » (conteneur, réseau, volumes) pour rester isolé
# des autres applications de la VM.
services:
  doublage:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/doublage:latest
    container_name: doublage
    restart: unless-stopped
    # Podman sans droits root : l'utilisateur du conteneur (1000) = le compte qui lance l'application,
    # pour que les fichiers du dossier de données lui appartiennent.
    userns_mode: "keep-id:uid=1000,gid=1000"
    env_file: .env
    ports:
      - "${DOUBLAGE_PORT:-8091}:8000"
    volumes:
      # :Z = étiquette SELinux (Oracle Linux)
      - "${DOUBLAGE_DONNEES:-/srv/apps/doublage/data}:/data:Z"
      - doublage-modeles:/home/doublage/.cache/huggingface
    # Pocket TTS utilise ~2 cœurs : on borne pour ne pas gêner les autres applications.
    cpus: 2
    mem_limit: 4g
    networks:
      - doublage-reseau

volumes:
  doublage-modeles:

networks:
  doublage-reseau:
