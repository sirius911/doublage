[project]
name = "doublage"
version = "0.1.0"
description = "Doublage de tutoriels vidéo par voix de synthèse (Whisper interne + Pocket TTS)"
readme = "SPEC.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Synthèse vocale : lourde (PyTorch), séparée pour garder des tests rapides.
tts = ["pocket-tts>=4.0", "torch>=2.5"]

[project.scripts]
doublage = "doublage.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

# PyTorch en version processeur uniquement (évite ~3 Go de bibliothèques CUDA).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["tts: nécessite Pocket TTS (lent, télécharge le modèle)"]
addopts = "-m 'not tts'"
