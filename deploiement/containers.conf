# Réglages Podman propres à doublage, ajoutés par-dessus la configuration existante
# (variable CONTAINERS_CONF_OVERRIDE, positionnée par deploiement/podman-doublage).
[engine]
# État d'exécution séparé de celui de scribe : sans cela, au redémarrage de la VM, la
# réinitialisation de l'un des deux stockages libérerait les verrous des conteneurs de l'autre.
tmp_dir = "/run/user/1002/doublage/libpod"
# Verrous en fichiers (dans tmp_dir) plutôt qu'en mémoire partagée commune à tout l'utilisateur.
lock_type = "file"
# Fichiers temporaires de construction d'image sur le volume dédié (et non dans /var/tmp).
image_copy_tmp_dir = "/var/lib/containers/doublage/tmp"
