# Stockage Podman dédié à doublage — VM svp-recvoc-a3p, utilisateur lorcyr (uid 1002).
#
# Lu comme fichier de configuration *utilisateur* grâce à XDG_CONFIG_HOME, positionné par
# deploiement/podman-doublage. C'est la seule façon, sans droits root, de faire prendre en compte
# graphroot et runroot (via CONTAINERS_STORAGE_CONF, Podman les ignore en mode sans root).
# Le stockage par défaut de lorcyr (~/.local/share/containers, utilisé par scribe) et la
# configuration globale de Podman ne sont pas modifiés.
[storage]
driver = "overlay"
graphroot = "/var/lib/containers/doublage/storage"
runroot = "/run/user/1002/doublage/storage"

[storage.options.overlay]
# Comme le stockage actuel de lorcyr (« overlay {} ») : pas de mount_program forcé. Podman choisit
# lui-même overlay natif ou fuse-overlayfs selon le noyau (UEK 5.4 sur la VM), comme pour scribe.
# Ne pas changer après la première utilisation (il faudrait repartir d'un stockage vide).
#mount_program = "/usr/bin/fuse-overlayfs"
